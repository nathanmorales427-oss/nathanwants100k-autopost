name: Post today's carousel

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 6:00 PM in Quito (and US Eastern from Nov 1). GitHub may start a few minutes late.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check, don't post"
        type: boolean
        default: true
      post_date:
        description: "Queue date to post (YYYY-MM-DD). Empty = today in Quito."
        required: false

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          POST_DATE: ${{ inputs.post_date }}
        run: python publish.py
      - name: Move the posted folder out of the queue
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "posted $(date -u +%F)" && git push)
